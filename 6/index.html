
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Marks Calculator</h1>

        <label for="java">Java</label>
        <input type="number" id="java" min="0" max="100">

        <label for="fullstack">Full Stack</label>
        <input type="number" id="fullstack" min="0" max="100">

        <label for="datamining">Data Mining</label>
        <input type="number" id="datamining" min="0" max="100">

        <label for="aiml">AI / ML</label>
        <input type="number" id="aiml" min="0" max="100">

        <label for="ke">Knowledge Engineering</label>
        <input type="number" id="ke" min="0" max="100">

        <button onclick="calculateResult()">Calculate Result</button>

        <div class="result">
            <p id="total">Total: </p>
            <p id="average">Average: </p>
            <p id="grade">Grade: </p>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
